<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#f3efe4}
  .cover{position:relative;width:1500px;height:1000px;overflow:hidden;background:#080d16}
  .cover img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,7,12,.97) 0%,rgba(4,7,12,.93) 40%,rgba(4,7,12,.35) 70%,rgba(4,7,12,.7) 100%)}
  .rule{height:1px;background:linear-gradient(90deg,rgba(226,87,31,.95),rgba(226,87,31,0));width:130px}
  .song{font-family:"Songti SC","SimSun",serif}
</style>
</head>
<body>
<div class="cover">
  <img class="bg" src="stills/11-cover-bg.png">
  <div class="scrim"></div>

  <div style="position:absolute;left:96px;top:196px;width:720px">
    <div class="song" style="font-size:19px;letter-spacing:.4em;color:rgba(243,239,228,.5)">2026 BOKE NEW WAVE · 文旅融合（窑火相传）</div>
    <div class="rule" style="margin:28px 0 26px"></div>
    <div class="song" style="font-size:186px;letter-spacing:.2em;line-height:1;color:#fbf7ec;text-shadow:0 0 70px rgba(226,87,31,.45)">把桩</div>
    <div class="song" style="font-size:34px;letter-spacing:.14em;color:#cfc7b6;margin-top:34px">一窑火，十二个时辰，一片瓷告诉你火候</div>
    <div style="font-size:15px;letter-spacing:.42em;color:rgba(243,239,228,.36);margin-top:16px">BA ZHUANG — THE KILN MASTER</div>
  </div>

  <div style="position:absolute;left:96px;bottom:96px;display:flex;gap:18px;align-items:center">
    <div style="border:1px solid rgba(243,239,228,.24);padding:9px 18px;font-size:15px;letter-spacing:.14em;color:#e6dfd1">浏览器直接玩</div>
    <div style="border:1px solid rgba(243,239,228,.24);padding:9px 18px;font-size:15px;letter-spacing:.14em;color:#e6dfd1">无需登录</div>
    <div style="border:1px solid rgba(243,239,228,.24);padding:9px 18px;font-size:15px;letter-spacing:.14em;color:#e6dfd1">一局 15–20 分钟</div>
  </div>

  <div style="position:absolute;right:96px;bottom:100px;text-align:right">
    <div class="song" style="font-size:22px;letter-spacing:.18em;color:rgba(243,239,228,.72)">火照子 · 判断火候的唯一仪表</div>
    <div style="font-size:14px;letter-spacing:.22em;color:rgba(243,239,228,.34);margin-top:8px">A SHARD OF PORCELAIN, PULLED FROM THE FIRE HOLE</div>
  </div>
</div>
</body>
</html>
